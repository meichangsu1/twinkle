runtime:
  mode: ray
  model_gpus: 2
  sampler_gpus: 1
  sampler_tp: 1
  lazy_collect: false

experiment:
  run_id: async_single_lora_match_short_math_seed42
  mode: async_single_lora_match_short_math
  seed: 42
  metrics:
    output_dir: outputs/async_rl_experiments
    enable_jsonl: true
    enable_swanlab: false

lora_context:
  tenant_id: tenant_a
  training_run_id: gsm8k_grpo_single_lora_match_short_math
  base_model_id: ms://Qwen/Qwen3.5-0.8B
  adapter_name: tenant_a_gsm8k_lora
  reward_type: gsm8k
  tool_profile: default
  rollout:
    batch_size: 4
  train:
    mini_batch_size: 1
  dataset:
    dataset_id: ms://modelscope/gsm8k
    subset_name: main
    split: train
    data_num: 2000
    max_length: 4096
    processor:
      cls: GSM8KProcessor
      system: >-
        You are a helpful math assistant. Solve the problem with minimal but
        correct reasoning and put your final answer within \boxed{}.

lora_contexts:
  - tenant_id: tenant_a
    training_run_id: gsm8k_grpo_single_lora_match_short_math
    base_model_id: ms://Qwen/Qwen3.5-0.8B
    adapter_name: tenant_a_gsm8k_lora
    reward_type: gsm8k
    tool_profile: default
    rollout:
      batch_size: 4
    train:
      mini_batch_size: 1
    dataset:
      dataset_id: ms://modelscope/gsm8k
      subset_name: main
      split: train
      data_num: 2000
      max_length: 4096
      processor:
        cls: GSM8KProcessor
        system: >-
          You are a helpful math assistant. Solve the problem with minimal but
          correct reasoning and put your final answer within \boxed{}.

model:
  mesh:
    dp_size: 2
    tp_size: 1
    ep_size: 1
    pp_size: 1
    sequence_parallel: false
  mixed_precision: bf16
  lora:
    target_modules: all-linear
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
  gradient_accumulation_steps: 1
  loss:
    cls: GRPOLoss
    epsilon: 0.2
  optimizer:
    cls: AdamW
    lr: 5.0e-5
  lr_scheduler:
    cls: CosineAnnealingLR
    T_max: 100
    eta_min: 0
  processor:
    cls: InputProcessor
    padding_free: true
  template:
    cls: Qwen3_5Template
    max_length: 4096
    truncation_strategy: delete
    enable_thinking: false
  adapter_checkpoint_dir: output/async_single_lora_match_short_math/lora_sync

sampler:
  engine_args:
    gpu_memory_utilization: 0.8
    max_model_len: 8192
    max_loras: 1
    max_lora_rank: 16
    enable_lora: true
    seed: 42
  template:
    cls: Qwen3_5Template
    enable_thinking: false
  sampling_params:
    max_tokens: 1024
    num_samples: 1
    logprobs: 1
    temperature: 1.0
    top_p: 0.95

pipeline:
  # One async partition contains 4 prompt groups * 8 generations = 32 samples.
  # With default_mini_batch_size=1, each partition produces 4 train_batch_done
  # events, matching short_math MAX_STEPS=100 when max_steps=25.
  max_steps: 25
  max_staleness: 0
  default_rollout_batch_size: 4
  default_mini_batch_size: 1
  rollout_policy: weighted_fair
  train_policy: weighted_fair
  rollout:
    num_generations: 8
    max_concurrency: 4
  save_name_prefix: async-single-lora-match-short-math
  save_optimizer: false
  is_sampler_checkpoint: false
  max_grad_norm: 1.0
  norm_type: 2

transfer_queue:
  init: true
  total_storage_size: 200000
  num_data_storage_units: 4
  storage_backend: SimpleStorage


