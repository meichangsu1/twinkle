runtime:
  model_id: ${oc.env:MODEL_ID,ms://Qwen/Qwen3.5-4B}
  mode: ray
  model_gpus: 2
  sampler_gpus: 1
  sampler_tp: 1
  sampler_max_loras: 4
  max_steps: null
  keep_adapter_versions: 2
  output_dir: output/sync_barrier_multi_lora_grpo
  metrics_path: outputs/sync_barrier_rl/metrics.jsonl
  run_id: sync_barrier_multi_lora_grpo

template:
  cls: Qwen3_5Template
  enable_thinking: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  learning_rate: 5.0e-5

lora_contexts:
  - tenant_id: tenant_a
    training_run_id: gsm8k_sync
    adapter_name: tenant_a_gsm8k_lora
    reward_type: gsm8k_accuracy
    dataset:
      dataset_id: ${oc.env:DATASET_ID,ms://modelscope/gsm8k}
      subset_name: main
      split: train
      data_num: 128
      max_length: 8192
      processor: GSM8KProcessor
    rollout:
      batch_size: 16
      num_generations: 4
      max_tokens: 4096
      temperature: 1.0
      top_p: 0.95
    advantage:
      groups_per_batch: 1
    train:
      groups_per_batch: 1
      micro_batch_size: 1

  - tenant_id: tenant_b
    training_run_id: gsm8k_sync
    adapter_name: tenant_b_gsm8k_lora
    reward_type: gsm8k_accuracy
    dataset:
      dataset_id: ${oc.env:DATASET_ID,ms://modelscope/gsm8k}
      subset_name: main
      split: train
      data_num: 128
      max_length: 8192
      processor: GSM8KProcessor
    rollout:
      batch_size: 16
      num_generations: 4
      max_tokens: 4096
      temperature: 1.0
      top_p: 0.95
    advantage:
      groups_per_batch: 1
    train:
      groups_per_batch: 1
      micro_batch_size: 1
