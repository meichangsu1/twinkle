# Asynchronous single-tenant DAPO comparison run. Apart from the execution
# schedule, this file matches compare_single_lora_dapo_sync.yaml.
runtime:
  run_id: compare_single_lora_dapo_async
  model_id: ${oc.env:MODEL_ID,/nas/disk1/Qwen3-4B}
  mode: ray
  model_gpus: 2
  sampler_gpus: 1
  sampler_tp: 1
  sampler_max_loras: 1
  seed: 1
  max_staleness: 2
  max_steps: null
  allow_partial_rollout: false
  rollout_max_retries: 2
  rollout_retry_delay_s: 0.5
  keep_adapter_versions: 2
  output_dir: output/compare_single_lora_dapo_async

metrics:
  enabled: true
  drain_interval_s: 1.0
  queue_capacity: 10000
  close_timeout_s: 10
  jsonl:
    enabled: true
    path: outputs/async_rl/compare_single_lora_dapo_async_metrics.jsonl
    summary_path: outputs/async_rl/compare_single_lora_dapo_async_summary.json
    batch_size: 64
    flush_interval_s: 2.0
  swanlab:
    enabled: false
    mode: local
    project: twinkle-rl
    name: ${runtime.run_id}
    log_dir: outputs/swanlab

template:
  cls: Template
  enable_thinking: false

model:
  strategy: native_fsdp
  attn_implementation: flash_attention_2
  fsdp_config:
    reshard_after_forward: true
  # Use two trainer GPUs as one Ulysses sequence-parallel group for long responses.
  sequence_parallel_size: 2
  padding_free: true
  max_length: 12288

sampler:
  max_model_len: 12288
  max_num_batched_tokens: 32768
  gpu_memory_utilization: 0.9
  max_num_seqs: 64
  enforce_eager: false

rollout_output:
  enabled: true
  output_dir: ${runtime.output_dir}/rollouts
  include_token_ids: false

tq:
  polling_mode: true
  storage_units: 2

scheduler:
  rollout: {policy: round_robin, max_consecutive_units: 1}
  advantage: {policy: oldest_partition, max_consecutive_units: 1}
  train: {policy: sticky, max_consecutive_units: null}

evaluation:
  enabled: false

lora:
  target_modules: all-linear
  r: 16
  alpha: 32
  dropout: 0.0
  learning_rate: 1.0e-6

loss:
  cls: GRPOLoss
  epsilon: 0.2

lora_contexts:
  - tenant_id: tenant_single
    training_run_id: dapo_compare
    adapter_name: dapo_compare_lora
    reward:
      class_path: twinkle.reward.DAPOMathReward
      kwargs:
        max_response_length: ${...rollout.max_tokens}
        overlong_buffer_length: 4096
        overlong_penalty_factor: 1.0
        score_tail_chars: 300
    dataset:
      dataset_id: ${oc.env:DAPO_TRAIN_DATASET_ID,ms://BytedTsinghua-SIA/DAPO-Math-17k}
      subset_name: default
      split: train
      data_num: 500
      max_length: 4096
      processor: DAPOMathProcessor
    rollout:
      batch_size: 16
      num_generations: 4
      max_tokens: 8192
      temperature: 1.0
      top_p: 0.95
    train:
      mini_batch_size: 32
      micro_batch_size: 2
      dynamic_batching: true
      max_tokens_per_micro_batch: 16384
      packing_algorithm: ffd
