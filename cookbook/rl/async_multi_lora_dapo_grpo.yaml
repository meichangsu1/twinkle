runtime:
  model_id: ${oc.env:MODEL_ID,ms://Qwen/Qwen3-4B}
  mode: ray
  model_gpus: 2
  sampler_gpus: 1
  sampler_tp: 1
  sampler_max_loras: 4
  max_staleness: 2
  max_steps: null
  allow_partial_rollout: false
  rollout_max_retries: 2
  rollout_retry_delay_s: 0.5
  keep_adapter_versions: 2
  output_dir: output/async_multi_lora_dapo_grpo
  metrics_path: outputs/async_rl/dapo_metrics.jsonl

template:
  cls: Template
  enable_thinking: false

model:
  # Two trainer GPUs form one Ulysses SP group. The effective model DP size is 1.
  sequence_parallel_size: 2
  padding_free: true
  attn_implementation: flash_attention_2
  max_length: 12288

sampler:
  max_model_len: 12288
  gpu_memory_utilization: 0.8
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  # Keep the long-sequence sampler on eager execution until CUDA-graph stability is verified.
  enforce_eager: true

tq:
  polling_mode: true
  storage_units: 2

scheduler:
  rollout: {policy: round_robin, max_consecutive_units: 1}
  advantage: {policy: oldest_partition, max_consecutive_units: 1}
  train: {policy: sticky, max_consecutive_units: null}

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Match verl's stable GRPO-on-DAPO learning rate. No scheduler means constant LR.
  learning_rate: 1.0e-6

lora_contexts:
  # Set both environment variables to distinct local parquet splits for a disjoint-tenant experiment.
  - tenant_id: tenant_a
    training_run_id: dapo_async
    adapter_name: tenant_a_dapo_math_lora
    reward_type: dapo_math
    reward:
      overlong_buffer_length: 4096
      overlong_penalty_factor: 1.0
      score_tail_chars: 300
    dataset:
      dataset_id: ${oc.env:TENANT_A_DAPO_DATASET_ID,ms://BytedTsinghua-SIA/DAPO-Math-17k}
      subset_name: default
      split: train
      data_num: 2000
      # Keeps prompt + max rollout tokens within model.max_length.
      max_length: 4096
      processor: DAPOMathProcessor
    rollout:
      batch_size: 16
      num_generations: 8
      max_tokens: 8192
      temperature: 1.0
      top_p: 0.95
    advantage:
      groups_per_batch: 1
    train:
      groups_per_batch: 1
      micro_batch_size: 1

  - tenant_id: tenant_b
    training_run_id: dapo_async
    adapter_name: tenant_b_dapo_math_lora
    reward_type: dapo_math
    reward:
      overlong_buffer_length: 4096
      overlong_penalty_factor: 1.0
      score_tail_chars: 300
    dataset:
      dataset_id: ${oc.env:TENANT_B_DAPO_DATASET_ID,ms://BytedTsinghua-SIA/DAPO-Math-17k}
      subset_name: default
      split: train
      data_num: 2000
      max_length: 4096
      processor: DAPOMathProcessor
    rollout:
      batch_size: 16
      num_generations: 8
      max_tokens: 8192
      temperature: 1.0
      top_p: 0.95
    advantage:
      groups_per_batch: 1
    train:
      groups_per_batch: 1
      micro_batch_size: 1


# export MODEL_ID=/nas/disk1/Qwen3.5-4B

# # 可选。不设置时，两个租户默认都读取远程 DAPO-Math-17k。
# export TENANT_A_DAPO_DATASET_ID=/path/to/tenant_a_dapo.parquet
# export TENANT_B_DAPO_DATASET_ID=/path/to/tenant_b_dapo.parquet

