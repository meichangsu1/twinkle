runtime:
  mode: ray
  model_gpus: 2
  sampler_gpus: 1
  sampler_tp: 1
  lazy_collect: false

experiment:
  run_id: async_relaxed_seed0
  mode: async_relaxed
  seed: 0
  metrics:
    output_dir: outputs/async_rl_experiments
    enable_jsonl: true
    enable_swanlab: true
    swanlab_project: twinkle

lora_context:
  tenant_id: tenant_a
  training_run_id: gsm8k_grpo_server_run_001
  base_model_id: ms://Qwen/Qwen3.5-0.8B
  adapter_name: tenant_a_gsm8k_lora
  reward_type: gsm8k
  tool_profile: default

lora_contexts:
  - tenant_id: tenant_a
    training_run_id: gsm8k_grpo_server_run_001
    base_model_id: ms://Qwen/Qwen3.5-0.8B
    adapter_name: tenant_a_gsm8k_lora
    reward_type: gsm8k
    tool_profile: default
    rollout:
      batch_size: 4
    train:
      mini_batch_size: 1
    model:
      optimizer:
        lr: 5.0e-5
    dataset:
      dataset_id: ms://modelscope/gsm8k
      subset_name: main
      split: train
      data_num: 2000
      max_length: 3072
      processor:
        cls: GSM8KProcessor
        system: >-
          You are a helpful math assistant. Solve the problem with minimal but
          correct reasoning and put your final answer within \boxed{}.
  - tenant_id: tenant_b
    training_run_id: gsm8k_grpo_server_run_002
    base_model_id: ms://Qwen/Qwen3.5-0.8B
    adapter_name: tenant_b_gsm8k_lora
    reward_type: gsm8k
    tool_profile: default
    rollout:
      batch_size: 4
    train:
      mini_batch_size: 1
    model:
      lora:
        r: 8
        lora_alpha: 16
      optimizer:
        lr: 3.0e-5
    dataset:
      dataset_id: ms://modelscope/gsm8k
      subset_name: main
      split: train
      data_num: 2000
      max_length: 3072
      processor:
        cls: GSM8KProcessor
        system: >-
          You are a helpful math assistant. Solve the problem with minimal but
          correct reasoning and put your final answer within \boxed{}.

model:
  mesh:
    dp_size: 2
    tp_size: 1
    ep_size: 1
    pp_size: 1
    sequence_parallel: false
  mixed_precision: bf16
  lora:
    target_modules: all-linear
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
  gradient_accumulation_steps: 4
  loss:
    cls: GRPOLoss
    epsilon: 0.2
  optimizer:
    cls: AdamW
    lr: 5.0e-5
  lr_scheduler:
    cls: LinearWarmupScheduler
    num_warmup_steps: 0
    num_training_steps: 1000
  processor:
    cls: InputProcessor
  template:
    cls: Qwen3_5Template
    max_length: 4096
    truncation_strategy: delete
    enable_thinking: false
  adapter_checkpoint_dir: output/async_multi_lora_grpo/lora_sync

sampler:
  engine_args:
    gpu_memory_utilization: 0.8
    max_model_len: 8192
    max_loras: 8
    max_lora_rank: 16
    enable_lora: true
  template:
    cls: Qwen3_5Template
    enable_thinking: false
  sampling_params:
    max_tokens: 1024
    num_samples: 1
    logprobs: 1
    temperature: 1.0
    top_p: 0.95

pipeline:
  max_steps: 1000
  max_staleness: 1
  default_rollout_batch_size: 4
  default_mini_batch_size: 1
  rollout_policy: weighted_fair
  train_policy: weighted_fair
  rollout:
    num_generations: 8
    max_concurrency: 16
  save_name_prefix: async-grpo-lora-sync
  save_optimizer: false
  is_sampler_checkpoint: false
  max_grad_norm: 1.0
  norm_type: 2

transfer_queue:
  init: true
  total_storage_size: 200000
  num_data_storage_units: 4
  storage_backend: SimpleStorage
