# Long-lived async-RL service with dynamic tenant registration.
#
# Required hardware with the defaults below:
#   runtime.model_gpus + runtime.sampler_gpus = 3 GPUs
#
# Start it with:
#   ray start --head
#   twinkle-server check-config -c cookbook/client/async_rl/server_config.yaml
#   twinkle-server launch -c cookbook/client/async_rl/server_config.yaml

ray_namespace: twinkle_async_rl
proxy_location: HeadOnly

http_options:
  host: 0.0.0.0
  port: 8000

telemetry:
  enabled: false

persistence:
  mode: memory

applications:
  - name: async-rl
    route_prefix: /api/v1/async-rl
    import_path: async_rl
    args:
      initial_owner_token: ${oc.env:TWINKLE_SERVER_TOKEN,dev-token}
      config:
        runtime:
          run_id: async_rl_server
          model_id: ${oc.env:MODEL_ID,ms://Qwen/Qwen3.5-4B}
          mode: ray
          model_gpus: 2
          sampler_gpus: 1
          sampler_tp: 1
          sampler_max_loras: 4
          max_staleness: 1
          max_steps: null
          allow_partial_rollout: false
          rollout_max_retries: 2
          rollout_retry_delay_s: 0.5
          keep_adapter_versions: 2
          output_dir: outputs/async_rl_server

        metrics:
          enabled: true
          drain_interval_s: 1.0
          queue_capacity: 10000
          close_timeout_s: 10
          jsonl:
            enabled: true
            path: outputs/async_rl_server/metrics.jsonl
            summary_path: outputs/async_rl_server/summary.json
            batch_size: 64
            flush_interval_s: 2.0
          swanlab:
            enabled: false

        template:
          cls: Qwen3_5Template
          enable_thinking: false

        model:
          strategy: native_fsdp
          fsdp_config:
            reshard_after_forward: true
          sequence_parallel_size: 1
          padding_free: false
          max_length: 8192

        sampler:
          max_model_len: 8192
          gpu_memory_utilization: 0.8
          max_num_seqs: 64
          max_num_batched_tokens: 8192
          enforce_eager: false

        rollout_output:
          enabled: true
          output_dir: outputs/async_rl_server/rollouts
          include_token_ids: false

        tq:
          polling_mode: true
          storage_units: 2

        scheduler:
          rollout:
            policy: round_robin
            max_consecutive_units: 1
          advantage:
            policy: oldest_partition
            max_consecutive_units: 1
          train:
            policy: sticky
            max_consecutive_units: null

        lora:
          target_modules: all-linear
          r: 16
          alpha: 32
          dropout: 0.05
          learning_rate: 5.0e-5
          lr_scheduler:
            cls: CosineAnnealingLR
            T_max: 2000
            eta_min: 0.0

        loss:
          cls: GRPOLoss
          epsilon: 0.2
          normalization: sequence_mean

        evaluation:
          enabled: false

        # Optional tenants declared here and tenants submitted over HTTP use
        # the same registration path. Keep this empty for a dynamic-only service.
        lora_contexts: []

    deployments:
      - name: AsyncRLManagement
        # The in-memory tenant registry and runtime have a single owner.
        num_replicas: 1
        max_ongoing_requests: 128
        ray_actor_options:
          num_cpus: 1
          runtime_env:
            env_vars:
              TWINKLE_TRUST_REMOTE_CODE: "1"
