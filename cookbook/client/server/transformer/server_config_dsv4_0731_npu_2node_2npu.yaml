# DeepSeek-V4-compatible Multi-LoRA SFT on two Ascend A3 nodes.
# Each node contributes 2 NPUs, giving a 4-rank Native FSDP2 + EP mesh.
#
# DSV4_MODEL_ID may be either:
#   - hf://deepseek-ai/DeepSeek-V4-Flash-0731
#   - ms://namespace/model-name
#   - the same absolute local model directory on both nodes

proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

telemetry:
  enabled: false
  otlp_endpoint: http://localhost:4317

persistence:
  mode: memory
  key_prefix: dsv4-0731-a3-2node-4npu

applications:
  - name: server
    route_prefix: /api/v1
    import_path: server
    args:
      server_config:
        per_token_model_limit: 2
      supported_models:
        - deepseek-v4-0731-local
    deployments:
      - name: TinkerCompatServer
        max_ongoing_requests: 50
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 32
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_FAIL_FAST: "1"

  - name: models-deepseek-v4-0731-local
    route_prefix: /api/v1/model/deepseek-v4-0731-local
    import_path: model
    args:
      backend: transformers
      # Resolved by OmegaConf when the head node reads this YAML.
      model_id: ${oc.env:DSV4_MODEL_ID,hf://deepseek-ai/DeepSeek-V4-Flash-0731}
      nproc_per_node: 2
      max_loras: 2
      max_r: 8
      max_length: 2048
      mixed_precision: bf16
      strategy: native_fsdp
      memory_efficient_init: true
      target_modules: all-linear
      fsdp_config:
        reshard_after_forward: true
        expert_parallel:
          enabled: true
          ep_size: 4
          router_dtype: fp32
          keep_router_logits: false
      device_group:
        name: model
        ranks: 4
        device_type: npu
      device_mesh:
        device_type: npu
        fsdp_size: 4
        dp_size: 1
        ep_size: 4
      queue_config:
        rps_limit: 20
        tps_limit: 100000
        max_input_tokens: 4096
        queue_timeout: 7200
        execution_timeout: 7200
      adapter_config:
        adapter_timeout: 60
        adapter_max_lifetime: 86400
    deployments:
      - name: ModelManagement
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 8
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_TRUST_REMOTE_CODE: "1"
              TWINKLE_FAIL_FAST: "1"

  - name: processor
    route_prefix: /api/v1/processor
    import_path: processor
    args:
      ncpu_proc_per_node: 2
      device_group:
        name: processor
        ranks: 2
        device_type: CPU
      device_mesh:
        device_type: CPU
        dp_size: 2
    deployments:
      - name: ProcessorManagement
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 32
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_TRUST_REMOTE_CODE: "1"
              TWINKLE_FAIL_FAST: "1"
